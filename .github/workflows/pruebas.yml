# Todas las pruebas, en cada push: nada se compila en la Mac. iOS se compila y
# se sube a TestFlight desde su propio repo (grupovimo/sintetica-ios).
name: Pruebas

on:
  push:
    branches: [claude/pensive-tesla-8fe2fg, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: Formato, núcleo (y oro) y simulador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld cmake
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Los tests de oro comparan contra el manual (y leen el QR).
      - run: pip install numpy pillow opencv-python-headless
      - run: npm ci
      - run: npm test

  fuzz:
    name: Fuzzing del núcleo (60 s por blanco)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake
      # Regresiones y semillas primero (ctest), después 60 s de libFuzzer por blanco.
      - run: JUNTOS=1 firmware/fuzz/correr.sh 60
        env: { CXX: clang++ }
      - if: always()
        run: tail -n 40 build/fuzz/*.log || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-fallas
          path: |
            build/fuzz/fallas/
            build/fuzz/*.log
          if-no-files-found: ignore
          retention-days: 30

  go:
    name: API y cgo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: sintetica, POSTGRES_PASSWORD: sintetica, POSTGRES_DB: pruebas }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sintetica" --health-interval 3s --health-retries 20
    env:
      SINTETICA_PRUEBAS_DB: postgres://sintetica:sintetica@localhost:5432/pruebas?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: test -z "$(gofmt -l api firmware/api/cgo)" || (gofmt -l api firmware/api/cgo; exit 1)
      - run: go vet ./api/... ./firmware/api/cgo/
      - run: go test -p 1 ./api/... ./firmware/api/cgo/

  e2e:
    name: De punta a punta en Docker
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: cp .env.example .env
      # Con un Telegram falso que sirve el test en el host (:8097).
      - run: docker compose up -d --build --wait
        env:
          ADMIN_EMAILS: "@ejemplo.com"
          ADMIN_TELEGRAM: "777000111"
          TELEGRAM_TOKEN: "1:e2e"
          TELEGRAM_API_URL: http://host.docker.internal:8097
      - run: go test -tags e2e -count=1 -v ./api/e2e/
        env:
          E2E_TELEGRAM: ":8097"
          E2E_TELEGRAM_ADMIN: "777000111"
      - if: failure()
        run: docker compose logs --tail 200

  web:
    name: Web (check, tests y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld
      - run: npm ci
        working-directory: web
      - run: npm run check && npm test && npm run build
        working-directory: web

  android:
    name: Android (tests)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest
        working-directory: android
      # El APK para instalar a mano (nada se compila en la Mac).
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        # Si se llena la cuota de artifacts de la cuenta, queda el release de abajo.
        continue-on-error: true
        with:
          name: sintetica-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      # El último APK de la rama, siempre en el mismo lugar (un prerelease que se pisa).
      - if: github.event_name == 'push'
        working-directory: android
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sintetica-debug.apk
          gh release view android-debug >/dev/null 2>&1 || \
            gh release create android-debug --prerelease --target "$GITHUB_SHA" --title "Android (debug)" --notes "El último APK de la rama."
          gh release upload android-debug sintetica-debug.apk --clobber
          gh release edit android-debug --notes "El último APK de la rama: ${GITHUB_SHA::7}."

  firmware:
    name: Firmware (las dos placas)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perfil: [dev-147b, broche-c3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.perfil }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.perfil }}
        working-directory: firmware

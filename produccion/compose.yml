# SintéticaOS en el VPS de Grupo Vimo (/opt/sintetica). Ver produccion/README.md.
#
# Las imágenes se arman desde lo commiteado y se mandan por ssh, sin registro
# (sh herramientas/desplegar-nube.sh); se pueden bajar de GHCR cambiando
# IMAGENES (por ejemplo ghcr.io/nawesan12/).
#
# Puertos (Docker se saltea UFW: todo en 127.0.0.1 salvo el 8883):
#   3600 web  → sintetica.grupovimo.com.ar      (Caddy + Cloudflare)
#   4400 API  → api-sintetica.grupovimo.com.ar  (Caddy + Cloudflare)
#   8883 MQTT con TLS (el broker está adentro de la API) →
#        mqtt-sintetica.grupovimo.com.ar (sin Cloudflare)
# Sin SMTP: el código para entrar va por Telegram (SMTP_SERVIDOR=ninguno).
name: sintetica

x-api-entorno: &api-entorno
  DATABASE_URL: postgres://sintetica:${POSTGRES_CLAVE:?falta POSTGRES_CLAVE}@postgres:5432/sintetica?sslmode=disable
  MQTT_USUARIO: api
  MQTT_CLAVE: ${MQTT_CLAVE_API:?falta MQTT_CLAVE_API}
  MQTT_URL_PUBLICA: mqtts://mqtt-sintetica.grupovimo.com.ar:8883
  # El broker MQTT embebido: los bichos por TLS; el 1883 sin TLS queda solo
  # adentro del contenedor (para mirar con docker compose exec).
  MQTT_TLS: ":8883"
  MQTT_TLS_MAX: "2000"
  MQTT_TLS_CERT: /certs/mqtt.crt
  MQTT_TLS_CLAVE: /certs/mqtt.key
  MQTT_TCP: 127.0.0.1:1883
  MQTT_TCP_MAX: "64"
  API_URL_PUBLICA: https://api-sintetica.grupovimo.com.ar
  API_URL_INTERNA: http://api:8080
  WEB_URL: https://sintetica.grupovimo.com.ar
  # Sin SMTP hasta tener el dominio: se entra con Telegram.
  SMTP_SERVIDOR: ${SMTP_SERVIDOR:-ninguno}
  SMTP_DE: Sintética Labs <hola@sinteticalabs.com>
  CLAVE_FIRMA: /claves/ota-privada.pem
  SECRETO: ${SECRETO:?falta SECRETO}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  ADMIN_TELEGRAM: ${ADMIN_TELEGRAM:-}
  COOKIE_SEGURA: "1"
  DESARROLLO: "0"
  # El bot de Telegram (sin token, las integraciones de Telegram quedan apagadas).
  TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
  TELEGRAM_BOT: ${TELEGRAM_BOT:-sinteticalabs_bot}
  TELEGRAM_CHAT_RESERVAS: ${TELEGRAM_CHAT_RESERVAS:-}
  MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
  # Spotify y la charla con IA (v1.9; vacías = apagadas).
  SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
  SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CHARLA_URL: ${CHARLA_URL:-}
  CHARLA_CLAVE: ${CHARLA_CLAVE:-}
  CHARLA_MODELO: ${CHARLA_MODELO:-}
  EDGE_TTS: ${EDGE_TTS:-1}
  EDGE_TTS_TOPE: ${EDGE_TTS_TOPE:-3000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sintetica
      POSTGRES_PASSWORD: ${POSTGRES_CLAVE}
      POSTGRES_DB: sintetica
    volumes:
      - ./pg:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sintetica"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  api:
    image: ${IMAGENES:-}sintetica-api:${VERSION:?falta VERSION (un sha)}
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-entorno
    volumes:
      - ./claves:/claves:ro
      # El certificado de MQTT (lo renueva el timer sintetica-cert): la API lo
      # relee sola cuando cambia, sin reiniciar.
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:4400:8080"
      - "8883:8883"
    # 192m de antes + el broker (2000 bichos ≈ 20–40 MB).
    mem_limit: 256m
    restart: unless-stopped

  web:
    image: ${IMAGENES:-}sintetica-web:${VERSION:?falta VERSION (un sha)}
    depends_on:
      api:
        condition: service_started
    environment:
      API_INTERNA: http://api:8080
      ORIGIN: https://sintetica.grupovimo.com.ar
      # La IP real del usuario (para los límites de la API): detrás de
      # Cloudflare y Caddy, la del socket es siempre la del proxy.
      ADDRESS_HEADER: CF-Connecting-IP
    ports:
      - "127.0.0.1:3600:3000"
    mem_limit: 192m
    restart: unless-stopped

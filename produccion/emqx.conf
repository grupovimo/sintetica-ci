## EMQX para SintéticaOS en el VPS (ver produccion/README.md).
## Igual que emqx/emqx.conf, pero: afuera solo MQTT con TLS (8883); el 1883
## queda adentro de Docker para la API; sin WebSocket; topes chicos de memoria
## (el VPS es compartido). La cookie del nodo viene de EMQX_NODE__COOKIE.

node {
  name = "emqx@127.0.0.1"
  data_dir = "data"
  process_limit = 65536
  max_ports = 16384
}

cluster {
  name = sintetica
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 18083
}

api_key {
  bootstrap_file = "etc/api-claves.txt"
}

## Solo para la API, adentro de la red de Docker (no se publica).
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 64
}

## Los bichos: mqtts://mqtt-sintetica.grupovimo.com.ar:8883. El certificado
## (Let's Encrypt) lo renueva el timer sintetica-cert en /opt/sintetica/certs.
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 2000
  ssl_options {
    certfile = "etc/certs/sintetica/mqtt.crt"
    keyfile = "etc/certs/sintetica/mqtt.key"
    versions = ["tlsv1.3", "tlsv1.2"]
  }
}

listeners.ws.default { enable = false }
listeners.wss.default { enable = false }

mqtt {
  max_packet_size = 1MB
  retain_available = true
}

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://api:8081/emqx/autenticar"
    headers { "content-type" = "application/json" }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    request_timeout = "5s"
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  cache {
    enable = true
    max_size = 64
    ttl = "1m"
  }
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://api:8081/emqx/autorizar"
      headers { "content-type" = "application/json" }
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
      request_timeout = "5s"
    }
  ]
}

log {
  console {
    enable = true
    level = warning
  }
}

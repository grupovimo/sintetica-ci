; SintéticaOS — firmware MVP (framework Arduino).
; El núcleo (nucleo/) es el mismo que corre en el simulador y en los tests.
; Cada entorno es un perfil de hardware: por ahora, la Waveshare ESP32-S3-LCD-1.47B.

[platformio]
src_dir = .
default_envs = dev-147b

; La clave pública de las OTA sale de claves/ota-publica.pem (npm run claves).
[env]
extra_scripts = pre:herramientas/clave_ota.py

[env:dev-147b]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_src_filter = +<nucleo/*.cpp> +<perfiles/comun/*.cpp> +<perfiles/dev-147b/*.cpp>
board_build.filesystem = littlefs
build_flags =
  -std=gnu++17
  -Inucleo
  -Iperfiles/comun
  -DBOARD_HAS_PSRAM
  -DSINTETICA_CON_WIFI
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
build_unflags = -std=gnu++11
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  h2zero/NimBLE-Arduino@1.4.2

; El broche: ESP32-C3 SuperMini (4 MB de flash, sin PSRAM) + GC9A01 redonda.
[env:broche-c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = perfiles/broche-c3/particiones.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_filter = +<nucleo/*.cpp> +<perfiles/comun/*.cpp> +<perfiles/broche-c3/*.cpp>
build_flags =
  -std=gnu++17
  -Inucleo
  -Iperfiles/comun
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
build_unflags = -std=gnu++11
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  h2zero/NimBLE-Arduino@1.4.2

; SintéticaOS — firmware MVP (framework Arduino).
; El núcleo (nucleo/) es el mismo que corre en el simulador y en los tests.
; Cada entorno es un perfil de hardware: por ahora, la Waveshare ESP32-S3-LCD-1.47B.

[platformio]
src_dir = .
default_envs = dev-147b

[env:dev-147b]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_src_filter = +<nucleo/*.cpp> +<perfiles/dev-147b/*.cpp>
build_flags =
  -std=gnu++17
  -Inucleo
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
build_unflags = -std=gnu++11
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  h2zero/NimBLE-Arduino@1.4.2

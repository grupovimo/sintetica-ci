## EMQX para SintéticaOS (local con Docker).
## Los bichos y la API se autentican y se autorizan contra la API
## (http://api:8081, un puerto que solo se ve adentro de Docker).

node {
  name = "emqx@127.0.0.1"
  cookie = "sintetica-local"
  data_dir = "data"
}

cluster {
  name = sintetica
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 18083
}

## La API usa la API REST de EMQX para echar a un bicho cuando se le revoca la clave.
api_key {
  bootstrap_file = "etc/api-claves.txt"
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10000
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
}

mqtt {
  max_packet_size = 1MB
  retain_available = true
}

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://api:8081/emqx/autenticar"
    headers { "content-type" = "application/json" }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    request_timeout = "5s"
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  cache {
    enable = true
    max_size = 64
    ttl = "1m"
  }
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://api:8081/emqx/autorizar"
      headers { "content-type" = "application/json" }
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
      request_timeout = "5s"
    }
  ]
}

log {
  console {
    enable = true
    level = warning
  }
}
